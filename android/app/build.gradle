apply plugin: 'com.android.application'

android {
    namespace "com.monitraq.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        if (org.gradle.api.JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
            println("Using Java 17 for build")
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    flavorDimensions "environment"
    productFlavors {
        production {
            dimension "environment"
            applicationId "com.monitraq.mobile"
        }
        staging {
            dimension "environment"
            applicationId "com.monitraq.mobile.staging"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    // Force .so files to be extracted to disk — fixes 16 KB page alignment
    // errors caused by vendor SDK libraries (liboffline-lib.so, libonline-lib.so)
    // that cannot be recompiled. extractNativeLibs=true in the manifest is
    // the official Android workaround for third-party non-conforming .so files.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    // Nordic BLE library - REQUIRED by Lepu SDK (version 2.10.0 as per official SDK docs)
    implementation 'no.nordicsemi.android:ble:2.10.0'
    // Live event bus for SDK communication - REQUIRED by Lepu SDK
    implementation 'io.github.jeremyliao:live-event-bus-x:1.8.0'
    // Stream Log library - REQUIRED by Lepu SDK (for logging functionality)
    // These are dependencies of the AAR file and must be included
    api 'io.getstream:stream-log-android:1.1.4'
    api 'io.getstream:stream-log-android-file:1.1.4'
    // Lepu BLE Pro SDK AAR for BP2 support
    // Version 1.0.8 supports BP2, BP2A, BP2T devices (as per official SDK docs)
    // Source: https://github.com/viatom-develop/LepuDemo.git
    implementation files('libs/lepu-blepro-1.0.8.aar')

    // AliveCor SDK integration
    implementation project(':AliveCorKitLite-release')

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation "androidx.navigation:navigation-fragment:2.8.3"
    implementation "androidx.navigation:navigation-ui:2.8.3"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
