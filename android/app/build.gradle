apply plugin: 'com.android.application'
// Kotlin Android plugin - REQUIRED to include kotlin-stdlib (+ SpillingKt) in the APK DEX.
// Without this, Kotlin runtime classes resolve in Gradle's dependency graph but are NOT
// written into classes.dex, causing NoClassDefFoundError at runtime for Kotlin-compiled SDK code.
apply plugin: 'kotlin-android'
// kotlin-parcelize plugin - REQUIRED by AliveCor SDK 1.7.3.
// RecordingConfig and other SDK classes use @Parcelize annotation which references
// kotlinx.parcelize.Parceler at runtime. Without this plugin the Parceler class is
// NOT included in the APK DEX, causing:
//   java.lang.ClassNotFoundException: kotlinx.parcelize.Parceler
//   → java.lang.NoClassDefFoundError: RecordingConfig$Companion
//   → FATAL EXCEPTION on FragEcgRealtime.onResume()
apply plugin: 'kotlin-parcelize'

android {
    namespace "com.monitraq.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    defaultConfig {
        applicationId "com.monitraq.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 29
        versionName "1.29"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        if (org.gradle.api.JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
            println("Using Java 17 for build")
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    flavorDimensions "environment"
    productFlavors {
        production {
            dimension "environment"
            applicationId "com.monitraq.mobile"
        }
        staging {
            dimension "environment"
            applicationId "com.monitraq.mobile"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('upload-key.keystore')
            storePassword 'monitraq'
            keyAlias 'upload'
            keyPassword 'monitraq'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    // Force .so files to be extracted to disk — fixes 16 KB page alignment
    // errors caused by vendor SDK libraries (liboffline-lib.so, libonline-lib.so)
    // that cannot be recompiled. extractNativeLibs=true in the manifest is
    // the official Android workaround for third-party non-conforming .so files.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        viewBinding true
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    // Nordic BLE library - REQUIRED by Lepu SDK (version 2.10.0 as per official SDK docs)
    implementation 'no.nordicsemi.android:ble:2.10.0'
    // Live event bus for SDK communication - REQUIRED by Lepu SDK
    implementation 'io.github.jeremyliao:live-event-bus-x:1.8.0'
    // Stream Log library - REQUIRED by Lepu SDK (for logging functionality)
    // These are dependencies of the AAR file and must be included
    api 'io.getstream:stream-log-android:1.1.4'
    api 'io.getstream:stream-log-android-file:1.1.4'
    // Lepu BLE Pro SDK AAR for BP2 support
    // Version 1.3.4 supports BP2, BP2A, BP2T devices (as per official SDK docs)
    // Source: https://github.com/viatom-develop/LepuDemo.git
    implementation files('libs/lepu-blepro-1.3.4.aar')

    // AliveCor SDK integration - REQUIRED dependencies for the AAR (v1.7.3)
    implementation files('libs/AliveCorKitLite-core-1.7.3-ec954cb3.aar')
    implementation 'net.danlew:android.joda:2.12.5'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0' // CRITICAL: Fixes NoClassDefFoundError for ScalarsConverterFactory
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'com.jakewharton.timber:timber:5.0.1' // Added to fix AliveCor SDK crash
    implementation 'com.google.dagger:dagger:2.51.1' // CRITICAL: Fixes NoClassDefFoundError for Preconditions
    annotationProcessor 'com.google.dagger:dagger-compiler:2.51.1'
    // Room 2.7.1 (KMP) - MUST match the version AliveCor SDK was compiled against.
    // The SDK's KardiaEcgDatabase_Impl uses createOpenDelegate() (new KMP API), NOT
    // createOpenHelper() (old API). Using Room < 2.7 causes AbstractMethodError at runtime.
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-rxjava2:2.7.1'
    // androidx.sqlite KMP library - required by Room 2.7+ for SQLiteConnection
    implementation 'androidx.sqlite:sqlite:2.5.1'
    implementation 'androidx.sqlite:sqlite-framework:2.5.1'
    // Lottie - REQUIRED by AliveCor SDK's EKGRecordActivity result screen.
    // Without this the app crashes with NoClassDefFoundError for LottieAnimationView
    // immediately after every successful ECG recording.
    implementation 'com.airbnb.android:lottie:6.6.10'
    // Kotlin stdlib + coroutines - REQUIRED by AliveCor SDK.
    // SDK was compiled with Kotlin 2.2.0 (confirmed from ThirdPartyAppSDKTest/build.gradle).
    // SpillingKt (kotlin.coroutines.jvm.internal.SpillingKt) is a Kotlin 2.0+ class used
    // for coroutine variable spilling optimization. Applying kotlin-android plugin ensures
    // the stdlib classes are actually written into the APK DEX at build time.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    // kotlinx-parcelize runtime - REQUIRED by AliveCor SDK 1.7.3.
    // @Parcelize-annotated classes (RecordingConfig, etc.) need Parceler at runtime.
    // The kotlin-parcelize plugin above generates the Parcelable implementation but
    // the runtime library must also be on the classpath in the final DEX.
    implementation 'org.jetbrains.kotlin:kotlin-parcelize-runtime:2.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'org.joda:joda-convert:3.0.1'

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // AliveCor SDK 1.7.3 sample app uses material 1.13.0 — required for m3 dynamic palette resources
    implementation 'com.google.android.material:material:1.13.0'
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    
    // AliveCor transitive dependencies found missing in logs
    implementation 'com.github.bosphere.android-filelogger:filelogger:1.0.7'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation "androidx.navigation:navigation-fragment:2.8.3"
    implementation "androidx.navigation:navigation-ui:2.8.3"
    implementation project(':capacitor-cordova-android-plugins')

    def camBridgeAar = file('libs/camerabridge.aar')
    if (camBridgeAar.exists()) {
        implementation files(camBridgeAar)
    } else {
        logger.lifecycle("camera bridge: libs/camerabridge.aar not found — native RTSP bridge disabled until built (see camera-bridge-core/Makefile)")
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
