// Top-level build file where you can add configuration options common to all sub-projects/modules.
// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.2.0'
    ext.kotlinVersion = "2.2.0"
    ext.hilt_version = '2.57.1'
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://maven.google.com/' }
        maven { url = "https://plugins.gradle.org/m2/" }
        maven {
            setUrl("https://jitpack.io")
            content { includeGroup("com.github.aasitnikov") }
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0' // can not upgrade to 8.13.0 - https://issuetracker.google.com/issues/377677809
        // classpath 'com.github.kezong:fat-aar:1.3.8'
        classpath 'com.github.aasitnikov:fat-aar-android:1.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.puppycrawl.tools:checkstyle:11.1.0'
        // classpath 'com.google.gms:google-services:4.3.10'
        // classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.1'

        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        def nav_version = "2.8.0"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
        // NOTE: MUST UPDATE THIS WHEN UPDATING ext.daggerHiltVersion
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
    }
}


allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
    }
}

ext {
    buildToolsVersion = '36.0.0'
    buildCompileSdkVersion = 36
    buildTargetSdkVersion = 36
    buildMinSdkVersion = 26
    libVersionCode = 4

    constraintLayoutVersion = "2.2.1"

    roomVersion = "2.7.2"
    daggerVersion = '2.57.1'
    daggerHiltVersion = "2.57.1"
    rxAndroidVersion = '2.1.1'
    rxJavaVersion = '2.2.21'
    gsonVersion = '2.13.2'
    timberVersion = '5.0.1'
    jodaVersion = '2.13.1'
    retrofitVersion = '3.0.0'
    okhttp3 = '5.1.0'

    kardiaAiLibVersion = '2.0.9-e57493c9'
    kardiaAiVersionV2 = '2.0.9'
    kardiaAiVersionV1 = '1.3.2'
    universalMonitorVersion = '1.3.5-edb63203'
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
